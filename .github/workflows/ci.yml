name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build -mod=readonly -o bin/eva-md ./cmd/eva-md

  # The latency gate, in a job of its own: it times hooks, and after the
  # tests of the job above the machine's load is several times its CPUs,
  # which the gate can only call "not judged". It builds the binary of the
  # commit before the change (the pull request's base, or the push's
  # parent) and the change's own, and runs each twice a round, alternating,
  # so that other splits of the same runs into two like halves serve as
  # controls (scripts/benchmark.py --compare). Advisory: it reports and
  # never fails the job, until an unchanged binary has passed it twenty
  # times with no fail between them, as docs/v2/baselines/README.md counts.
  latency:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      # The whole history, to build the commit before the change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: python3 -I scripts/bench/test_gate.py
      - run: go build -mod=readonly -o bin/eva-md ./cmd/eva-md
      - name: Latency gate (advisory)
        continue-on-error: true
        timeout-minutes: 30
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD^)
          fi
          echo "Comparing $BASE with $SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          cd "$RUNNER_TEMP/base"
          go build -mod=readonly -o "$RUNNER_TEMP/eva-md-base" ./cmd/eva-md
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/latency"
          uptime
          # The builds above leave the runner busy, and a busy runner cannot
          # be timed: in the first 23 runs its load was 10 to 30 here, and
          # the gate could not judge a third of them. Wait, five minutes at
          # most, until its load over the last minute is under its CPUs.
          cpus=$(sysctl -n hw.ncpu)
          for _ in $(seq 1 30); do
            load=$(sysctl -n vm.loadavg | awk '{ print $2 }')
            if awk -v l="$load" -v c="$cpus" 'BEGIN { exit !(l < c) }'; then
              break
            fi
            sleep 10
          done
          uptime
          python3 -I scripts/benchmark.py --compare "$RUNNER_TEMP/eva-md-base" bin/eva-md --cwd "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/latency/gate.json" --baseline "$RUNNER_TEMP/latency/latency-macos.json" --commit "$SHA"
      - name: Save the latency report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latency
          path: ${{ runner.temp }}/latency/
          if-no-files-found: ignore

  # The two guards of the v2 build, from the evaluation harness, which no
  # release builds. Ownership: each commit the change brings, on its first
  # parent, touches only the paths of the cards its Card: lines name; a
  # commit with no such line is the lead's and is listed, not judged; a
  # fault fails the job. Size: the Go built into eva-md for macOS, less
  # the lines of v1 files that merged cards schedule for deletion, stays
  # within v1's 53,694 lines. The base is found as the latency job finds
  # it, so the whole history is fetched; the size check also reads v1's
  # files from it.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Ownership
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD^)
          fi
          echo "Judging $BASE..$SHA"
          go run ./cmd/eva-eval paths "$BASE" "$SHA"
      # Advisory for now: it shows its figure in every run and never fails
      # the job, so that a count not yet settled blocks no release. No card
      # carries a deletes block yet; the lead writes them, and then makes
      # this step blocking by removing continue-on-error.
      - name: Size (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: go run ./cmd/eva-eval size

  # eva-md runs only on macOS, so the test job above is the test run of record.
  # This one keeps eva-md building and its tests passing on Linux, where
  # cloud sessions work on it. It runs the checks through the script cloud
  # sessions use, which gives the tests a TMPDIR outside /tmp: eva-md's hooks
  # skip folders under /tmp as temporary, and t.TempDir() would put every
  # test project there (on macOS TMPDIR is elsewhere). The runner isn't
  # root, so the script runs on the checkout directly.
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/linux-check.sh
